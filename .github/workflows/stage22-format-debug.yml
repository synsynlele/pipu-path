name: Stage22 format debug

on:
  push:
    branches:
      - agent/stage-22-human-potential-adventure

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format Stage 22 files
        run: |
          npx prettier --write \
            src/app/app/page.tsx \
            src/app/journey/page.tsx \
            'src/app/quests/[questId]/page.tsx' \
            'src/app/quests/[questId]/complete/page.tsx' \
            src/components/navigation/context-back-link.tsx \
            src/modules/identity/domain/builder-level.ts
      - name: Show exact formatter diff
        run: git diff --no-ext-diff -- \
          src/app/app/page.tsx \
          src/app/journey/page.tsx \
          'src/app/quests/[questId]/page.tsx' \
          'src/app/quests/[questId]/complete/page.tsx' \
          src/components/navigation/context-back-link.tsx \
          src/modules/identity/domain/builder-level.ts
