name: Stage 21 E2E Format Once

on:
  push:
    branches:
      - agent/stage-21-builder-passport-api

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-21-builder-passport-api
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/stage21-builder-passport-api.spec.ts
      - name: Commit formatting and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/stage21-e2e-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/stage21-builder-passport-api.spec.ts .github/workflows/stage21-e2e-format-once.yml
          git commit -m "style(stage21): format Passport release proof"
          git push origin HEAD:agent/stage-21-builder-passport-api
