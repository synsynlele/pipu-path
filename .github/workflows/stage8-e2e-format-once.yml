name: Stage 8 E2E Format Once

on:
  push:
    branches:
      - agent/stage8-builder-project-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage8-builder-project-mvp
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/stage8-project.spec.ts
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/stage8-project.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(stage8): format Project E2E"
            git push origin HEAD:agent/stage8-builder-project-mvp
          fi
