name: Stage 20 Split Migrations Once

on:
  push:
    branches:
      - agent/stage-20-opportunity-marketplace

permissions:
  contents: write

jobs:
  split:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(stage20): split migration for controlled apply') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-20-opportunity-marketplace
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate ordered migration shells
        run: |
          set -euo pipefail
          npx --no-install supabase migration new stage_20_opportunity_marketplace_provider
          sleep 1
          npx --no-install supabase migration new stage_20_opportunity_marketplace_catalog
          sleep 1
          npx --no-install supabase migration new stage_20_opportunity_marketplace_application
          sleep 1
          npx --no-install supabase migration new stage_20_opportunity_marketplace_provider_application
          sleep 1
          npx --no-install supabase migration new harden_stage_20_marketplace_privacy_v2
      - name: Split exact validated SQL at function boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import glob

          root = Path('supabase/migrations')
          source = root / '20260818123042_stage_20_opportunity_marketplace.sql'
          hardening = root / '20260818124524_harden_stage_20_marketplace_privacy.sql'
          text = source.read_text()
          hardening_text = hardening.read_text()

          markers = [
              'create or replace function public.get_stage20_admin_provider_registry()',
              'create or replace function public.get_stage20_marketplace_catalog()',
              'create or replace function public.save_stage20_opportunity_application_draft(',
              'create or replace function private.stage20_application_projection(',
          ]
          indices = []
          for marker in markers:
              index = text.find(marker)
              if index < 0:
                  raise SystemExit(f'Migration split marker not found: {marker}')
              indices.append(index)
          if indices != sorted(indices):
              raise SystemExit('Migration split markers are out of order')

          parts = [
              text[:indices[0]],
              text[indices[0]:indices[1]],
              text[indices[1]:indices[2]],
              text[indices[2]:indices[3]],
              text[indices[3]:],
          ]
          source.write_text(parts[0])

          names = [
              'stage_20_opportunity_marketplace_provider',
              'stage_20_opportunity_marketplace_catalog',
              'stage_20_opportunity_marketplace_application',
              'stage_20_opportunity_marketplace_provider_application',
          ]
          for name, part in zip(names, parts[1:]):
              matches = sorted(root.glob(f'*_{name}.sql'))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one generated migration for {name}, got {matches}')
              matches[0].write_text(part)

          hardening_matches = sorted(root.glob('*_harden_stage_20_marketplace_privacy_v2.sql'))
          if len(hardening_matches) != 1:
              raise SystemExit(f'Expected one generated hardening migration, got {hardening_matches}')
          hardening_matches[0].write_text(hardening_text)
          hardening.unlink()
          PY
      - name: Update Stage 20 structural test to read the ordered migration set
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/stage-20-opportunity-marketplace.test.ts')
          text = path.read_text()
          old = '''const migration = read(\n  "supabase/migrations/20260818123042_stage_20_opportunity_marketplace.sql",\n);\nconst hardening = read(\n  "supabase/migrations/20260818124524_harden_stage_20_marketplace_privacy.sql",\n);'''
          new = '''const migration = fs\n  .readdirSync(path.join(root, "supabase/migrations"))\n  .filter(\n    (file) =>\n      file.includes("stage_20_opportunity_marketplace") &&\n      !file.includes("harden_stage_20_marketplace_privacy"),\n  )\n  .sort()\n  .map((file) => read(`supabase/migrations/${file}`))\n  .join("\\n");\nconst hardeningFile = fs\n  .readdirSync(path.join(root, "supabase/migrations"))\n  .find((file) => file.includes("harden_stage_20_marketplace_privacy_v2"));\nif (!hardeningFile) throw new Error("Stage 20 hardening migration missing");\nconst hardening = read(`supabase/migrations/${hardeningFile}`);'''
          if old not in text:
              raise SystemExit('Expected Stage 20 migration test block not found')
          path.write_text(text.replace(old, new))
          PY
          npx --no-install prettier --write tests/integration/stage-20-opportunity-marketplace.test.ts
      - name: Remove temporary diagnostics and commit packaging change
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage20-static-diagnostic.yml
          rm .github/workflows/stage20-split-migrations-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations tests/integration/stage-20-opportunity-marketplace.test.ts .github/workflows
          git commit -m "chore(stage20): split migration for controlled apply"
          git push origin HEAD:agent/stage-20-opportunity-marketplace
