name: Format onboarding fix

on:
  push:
    branches:
      - fix/stage22-onboarding-ai-results

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stage22-onboarding-ai-results
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed source
        run: >-
          npx prettier --write
          src/app/onboarding/discovery/profile/page.tsx
          src/app/onboarding/discovery/profile/complete/page.tsx
          src/lib/ai/openai-structured-output.ts
          src/lib/ai/openai-structured-output.test.ts
          src/modules/human-potential/infrastructure/profile-dal.ts
          src/modules/human-potential/ui/profile-generation-form.tsx
          src/modules/economic-pathways/ui/economic-pathway-generation-form.tsx
          src/modules/economic-pathways/ui/path-selection-form.tsx
          vercel.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: format onboarding reliability fix"
          git push origin HEAD:fix/stage22-onboarding-ai-results
