name: Format Path switch audit

on:
  push:
    branches:
      - fix/path-switch-experience-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/path-switch-experience-audit
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format audited files
        run: >-
          npx prettier --write
          src/components/navigation/app-navigation-guide.test.tsx
          src/modules/economic-pathways/ui/path-selection-form.tsx
          tests/e2e/stage12-economic-pathways.spec.ts
          tests/e2e/stage22-builder-a-to-z.spec.ts
          tests/integration/stage-12-path-switch.test.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/components/navigation/app-navigation-guide.test.tsx \
            src/modules/economic-pathways/ui/path-selection-form.tsx \
            tests/e2e/stage12-economic-pathways.spec.ts \
            tests/e2e/stage22-builder-a-to-z.spec.ts \
            tests/integration/stage-12-path-switch.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Path-switch audit files"
            git push origin HEAD:fix/path-switch-experience-audit
          fi
