name: Format Unbuilt City immediate entry
on:
  pull_request:
    branches: [feat/unbuilt-city-visible-actions]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-auto-flow-options'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-auto-flow-options
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write public/games/city/game.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md .github/workflows/format-auto-entry.yml
      - name: Commit formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/game.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md .github/workflows/format-auto-entry.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format immediate Unbuilt City entry"
            git push origin HEAD:feat/unbuilt-city-auto-flow-options
          fi
