name: Stage 20 Final Format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-20-opportunity-marketplace
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/integration/stage-20-opportunity-marketplace.test.ts
      - name: Commit canonical formatting and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/stage20-final-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/stage-20-opportunity-marketplace.test.ts .github/workflows/stage20-final-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(stage20): apply final repository formatting"
          git push origin HEAD:agent/stage-20-opportunity-marketplace
