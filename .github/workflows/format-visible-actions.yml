name: Format Unbuilt City visible-action preview
on:
  pull_request:
    branches: [feat/unbuilt-city-pilot-challenges]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-visible-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-visible-actions
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write public/games/city/feedback.mjs public/games/city/scene-feedback.mjs public/games/city/game.mjs public/games/city/index.html public/games/shared/city-theme.css scripts/power-district/action-feedback.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md docs/product/unbuilt-city-decision-feedback.md .github/workflows/format-visible-actions.yml
      - name: Push formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/feedback.mjs public/games/city/scene-feedback.mjs public/games/city/game.mjs public/games/city/index.html public/games/shared/city-theme.css scripts/power-district/action-feedback.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md docs/product/unbuilt-city-decision-feedback.md .github/workflows/format-visible-actions.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format visible-action game preview"
            git push origin HEAD:feat/unbuilt-city-visible-actions
          fi
