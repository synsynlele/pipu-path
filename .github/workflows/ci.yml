name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-stage9:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9-selective-project-portfolio
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore reviewed Stage 9 implementation
        shell: bash
        run: |
          sed -n "/<<'PAYLOAD'/,/^PAYLOAD$/p" .github/workflows/stage9-publish-once.yml | sed '1d;$d' > /tmp/stage9_payload.b64
          base64 --decode /tmp/stage9_payload.b64 > /tmp/stage9_payload.tar.gz
          tar -xzf /tmp/stage9_payload.tar.gz -C .
          rm -f .github/workflows/stage9-publish-once.yml
          cat > .github/workflows/ci.yml <<'RESTORED_CI'
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate

  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: https://pipu-path-git-agent-stage8-bui-943f99-copyartint-2860s-projects.vercel.app
          E2E_STAGE3_EMAIL: ${{ secrets.E2E_STAGE3_EMAIL }}
          E2E_STAGE3_PASSWORD: ${{ secrets.E2E_STAGE3_PASSWORD }}
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
RESTORED_CI
      - run: npm ci
      - name: Verify reviewed slice
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run test:integration
      - name: Commit Stage 9 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(stage9): build selective Project portfolio"
          git push origin HEAD:agent/stage9-selective-project-portfolio

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate

  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: https://pipu-path-git-agent-stage8-bui-943f99-copyartint-2860s-projects.vercel.app
          E2E_STAGE3_EMAIL: ${{ secrets.E2E_STAGE3_EMAIL }}
          E2E_STAGE3_PASSWORD: ${{ secrets.E2E_STAGE3_PASSWORD }}
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
