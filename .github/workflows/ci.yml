name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Stage 24 canonical formatting diagnostic
        run: |
          npx prettier --write \
            src/app/app/page.tsx \
            src/app/discover/page.tsx \
            src/components/pwa/install-prompt.test.tsx \
            src/components/pwa/install-prompt.tsx \
            src/components/shells/auth-shell.tsx \
            src/components/shells/public-shell.tsx \
            tests/integration/stage-24-visual-install.test.ts
          git diff -- \
            src/app/app/page.tsx \
            src/app/discover/page.tsx \
            src/components/pwa/install-prompt.test.tsx \
            src/components/pwa/install-prompt.tsx \
            src/components/shells/auth-shell.tsx \
            src/components/shells/public-shell.tsx \
            tests/integration/stage-24-visual-install.test.ts
          exit 1

  staging-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_STAGE3_EMAIL: ${{ secrets.E2E_STAGE3_EMAIL }}
          E2E_STAGE3_PASSWORD: ${{ secrets.E2E_STAGE3_PASSWORD }}
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
