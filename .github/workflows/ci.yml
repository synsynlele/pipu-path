name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Stage 26 formatting carrier
        run: >-
          npx prettier --write
          src/app/app/page.tsx
          src/app/build/page.tsx
          src/app/connect/page.tsx
          src/app/discover/page.tsx
          src/app/profile/page.tsx
          src/app/stage26.css
          src/components/navigation/app-navigation.tsx
          src/components/onboarding/onboarding-shell.tsx
          src/components/ui/app-page-skeleton.tsx
      - name: Upload Stage 26 formatted source
        uses: actions/upload-artifact@v4
        with:
          name: stage26-formatted-source
          path: |
            src/app/app/page.tsx
            src/app/build/page.tsx
            src/app/connect/page.tsx
            src/app/discover/page.tsx
            src/app/profile/page.tsx
            src/app/stage26.css
            src/components/navigation/app-navigation.tsx
            src/components/onboarding/onboarding-shell.tsx
            src/components/ui/app-page-skeleton.tsx
      - run: npm run validate

  staging-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_STAGE3_EMAIL: ${{ secrets.E2E_STAGE3_EMAIL }}
          E2E_STAGE3_PASSWORD: ${{ secrets.E2E_STAGE3_PASSWORD }}
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
