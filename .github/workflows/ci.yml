name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format focus/rotation changes and validate
        run: |
          npx prettier --write src/modules/city/ui/power-district-frame.tsx src/modules/city/ui/power-district-frame.test.tsx src/modules/city/ui/unbuilt-city-experience.tsx src/modules/city/ui/build-lab.test.ts
          echo FOCUS_ROTATE_PATCH_BEGIN
          git diff -- src/modules/city/ui/power-district-frame.tsx src/modules/city/ui/power-district-frame.test.tsx src/modules/city/ui/unbuilt-city-experience.tsx src/modules/city/ui/build-lab.test.ts
          echo FOCUS_ROTATE_PATCH_END
          npm run validate

  staging-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_STAGE3_EMAIL: ${{ secrets.E2E_STAGE3_EMAIL }}
          E2E_STAGE3_PASSWORD: ${{ secrets.E2E_STAGE3_PASSWORD }}
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
