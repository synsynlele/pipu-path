name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stage11-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-stage11:
    if: github.head_ref == 'agent/stage11-builder-connect'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage11-builder-connect
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Publish formatting fixes
        run: |
          git config user.name 'pipu-path-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout HEAD -- .github/workflows/ci.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style(stage11): apply repository formatting'
          git push origin HEAD:agent/stage11-builder-connect
