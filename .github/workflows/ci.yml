name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply final Stage 26 source corrections
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          connect = Path("src/app/connect/page.tsx")
          source = connect.read_text()
          connect.write_text(source.replace("Active Builders", "Discoverable Builders"))
          PY
          npx prettier --write \
            src/app/app/page.tsx \
            src/app/build/page.tsx \
            src/app/connect/page.tsx \
            src/app/discover/page.tsx \
            src/app/profile/page.tsx \
            src/app/stage26.css \
            src/components/navigation/app-navigation.tsx \
            src/components/onboarding/onboarding-shell.tsx \
            src/components/ui/app-page-skeleton.tsx
      - name: Commit canonical Stage 26 source
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "Stage 26 source is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/app/page.tsx \
            src/app/build/page.tsx \
            src/app/connect/page.tsx \
            src/app/discover/page.tsx \
            src/app/profile/page.tsx \
            src/app/stage26.css \
            src/components/navigation/app-navigation.tsx \
            src/components/onboarding/onboarding-shell.tsx \
            src/components/ui/app-page-skeleton.tsx
          git commit -m "Stage 26: apply canonical source formatting"
          git push origin HEAD:${{ github.head_ref }}
      - run: npm run validate

  staging-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_STAGE3_EMAIL: ${{ secrets.E2E_STAGE3_EMAIL }}
          E2E_STAGE3_PASSWORD: ${{ secrets.E2E_STAGE3_PASSWORD }}
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
