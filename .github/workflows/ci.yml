name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pipupath-2-unified-play-quests-you
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format unified app integration once
        run: |
          npx prettier --write public/games/city/game.mjs src/app/app/page.tsx src/app/page.tsx src/app/play/page.tsx src/app/profile/page.tsx src/app/real-quests/page.tsx src/components/navigation/app-navigation.test.tsx src/components/navigation/app-navigation.tsx src/components/shells/app-shell.tsx src/modules/city/ui/power-district-frame.test.tsx src/modules/city/ui/power-district-frame.tsx src/modules/city/ui/unbuilt-city-experience.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/game.mjs src/app/app/page.tsx src/app/page.tsx src/app/play/page.tsx src/app/profile/page.tsx src/app/real-quests/page.tsx src/components/navigation/app-navigation.test.tsx src/components/navigation/app-navigation.tsx src/components/shells/app-shell.tsx src/modules/city/ui/power-district-frame.test.tsx src/modules/city/ui/power-district-frame.tsx src/modules/city/ui/unbuilt-city-experience.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format unified navigation and Quest handoff"
            git push origin HEAD:feat/pipupath-2-unified-play-quests-you
          fi
      - run: npm run validate

  staging-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_STAGE3_EMAIL: ${{ secrets.E2E_STAGE3_EMAIL }}
          E2E_STAGE3_PASSWORD: ${{ secrets.E2E_STAGE3_PASSWORD }}
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
