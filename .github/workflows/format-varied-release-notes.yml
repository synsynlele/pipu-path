name: Format Advanced City Release Notes
on:
  push:
    branches:
      - feat/varied-city-challenges-repeatable-decor-20261031
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/varied-city-challenges-repeatable-decor-20261031
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install prettier --write docs/implementation/ledger.md docs/implementation/status.md
      - name: Commit release note formatting
        run: |
          git config user.name "PipuPath CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add docs/implementation/ledger.md docs/implementation/status.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format varied city release notes"
            git push origin HEAD:refs/heads/feat/varied-city-challenges-repeatable-decor-20261031
          fi
