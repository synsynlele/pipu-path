name: Stage 17 candidate formatter

on:
  push:
    branches:
      - agent/stage-17-ai-personal-builder-guide
    paths:
      - ".github/workflows/stage17-surface-guide.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-17-ai-personal-builder-guide
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/app/page.tsx src/app/guide/page.tsx src/modules/builder-guide/application/builder-guide-actions.ts src/modules/builder-guide/application/builder-guide-fallback.test.ts src/modules/builder-guide/application/builder-guide-fallback.ts src/modules/builder-guide/domain/builder-guide-contract.test.ts src/modules/builder-guide/infrastructure/builder-guide-dal.ts tests/integration/stage-17-ai-personal-builder-guide.test.ts
      - name: Commit formatting and remove formatter
        run: |
          rm .github/workflows/stage17-surface-guide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(stage17): format implementation candidate"
          git push origin HEAD:agent/stage-17-ai-personal-builder-guide
