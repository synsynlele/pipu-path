name: Stage 20 Integration Hardening Once

on:
  push:
    branches:
      - agent/stage-20-opportunity-marketplace

permissions:
  contents: write

jobs:
  fix:
    if: "${{ !startsWith(github.event.head_commit.message, 'fix(stage20): harden closed-supply and provider evidence privacy') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-20-opportunity-marketplace
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply the isolated integration and privacy fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path_str}: {old[:100]!r}')
              path.write_text(text.replace(old, new))

          # Brittle case-sensitive quota assertion -> semantic lowercase check.
          replace(
              'tests/integration/stage-20-opportunity-marketplace.test.ts',
              '''    expect(projectState).toContain(\n      "Automatic Vercel Preview deployment is disabled",\n    );''',
              '''    expect(projectState.toLowerCase()).toContain(\n      "automatic vercel preview deployment is disabled",\n    );''',
          )

          # Provider-shared application evidence must not include private route hrefs.
          replace(
              'src/modules/opportunities/domain/marketplace-contract.ts',
              '''export const marketplaceInstitutionVerificationSelectionSchema = z.object({''',
              '''export const marketplaceSharedEvidenceSchema =\n  marketplaceEvidenceSelectionSchema.omit({ sourceHref: true });\n\nexport const marketplaceInstitutionVerificationSelectionSchema = z.object({''',
          )
          replace(
              'src/modules/opportunities/domain/marketplace-contract.ts',
              '''  evidence: z.array(marketplaceEvidenceSelectionSchema).max(20),''',
              '''  evidence: z.array(marketplaceSharedEvidenceSchema).max(20),''',
          )

          # Parse and honor the database canEdit authority.
          replace(
              'src/modules/opportunities/infrastructure/marketplace-dal.ts',
              '''export type BuilderApplicationWorkspace = {\n  opportunity:''',
              '''export type BuilderApplicationWorkspace = {\n  canEdit: boolean;\n  opportunity:''',
          )
          replace(
              'src/modules/opportunities/infrastructure/marketplace-dal.ts',
              '''  const providerStatus = opportunityProviderStatusSchema.safeParse(\n    provider.status,\n  );\n\n  const opportunityId''',
              '''  const providerStatus = opportunityProviderStatusSchema.safeParse(\n    provider.status,\n  );\n  if (typeof row.canEdit !== "boolean") {\n    throw new Error("MARKETPLACE_APPLICATION_WORKSPACE_INVALID");\n  }\n  const canEdit = row.canEdit;\n\n  const opportunityId''',
          )
          replace(
              'src/modules/opportunities/infrastructure/marketplace-dal.ts',
              '''  return {\n    opportunity: {''',
              '''  return {\n    canEdit,\n    opportunity: {''',
          )

          replace(
              'src/app/opportunities/[opportunityId]/apply/page.tsx',
              '''  const editable = application === null || application.status === "draft";''',
              '''  const editable =\n    workspace.canEdit &&\n    (application === null || application.status === "draft");''',
          )
          replace(
              'src/app/opportunities/[opportunityId]/apply/page.tsx',
              '''  const hasSavedDraft = application?.status === "draft";''',
              '''  const hasSavedDraft =\n    workspace.canEdit && application?.status === "draft";''',
          )

          # Provider UI gets the evidence snapshot only, not a private PipuPath route.
          replace(
              'src/app/provider/applications/page.tsx',
              '''                  <p className="mt-1 leading-6">{evidence.evidenceSummary}</p>\n                  <Link\n                    href={evidence.sourceHref}\n                    className="text-gold mt-2 inline-block font-semibold"\n                  >\n                    Open PipuPath evidence\n                  </Link>''',
              '''                  <p className="mt-1 leading-6">{evidence.evidenceSummary}</p>''',
          )

          # Provider-side database projection likewise excludes the private route href.
          replace(
              'supabase/migrations/20260818124524_harden_stage_20_marketplace_privacy.sql',
              '''        'sourceTitle', selection.source_title,\n        'evidenceSummary', selection.evidence_summary,\n        'sourceHref', selection.source_href''',
              '''        'sourceTitle', selection.source_title,\n        'evidenceSummary', selection.evidence_summary''',
          )

          # Lock the new privacy guarantee structurally.
          replace(
              'tests/integration/stage-20-opportunity-marketplace.test.ts',
              '''    expect(projection).not.toContain("builder_user_id");\n    expect(projection).toContain("displayName");''',
              '''    expect(projection).not.toContain("builder_user_id");\n    expect(projection).not.toContain("sourceHref");\n    expect(projection).not.toContain("source_href");\n    expect(projection).toContain("displayName");''',
          )
          PY
          npx --no-install prettier --write \
            tests/integration/stage-20-opportunity-marketplace.test.ts \
            src/modules/opportunities/domain/marketplace-contract.ts \
            src/modules/opportunities/infrastructure/marketplace-dal.ts \
            'src/app/opportunities/[opportunityId]/apply/page.tsx' \
            src/app/provider/applications/page.tsx
      - name: Remove diagnostics and commit the verified hardening
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage20-diagnostic.yml
          rm .github/workflows/stage20-integration-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests supabase/migrations .github/workflows
          git commit -m "fix(stage20): harden closed-supply and provider evidence privacy"
          git push origin HEAD:agent/stage-20-opportunity-marketplace
