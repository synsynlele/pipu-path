name: Stage18 ledger once

on:
  push:
    branches:
      - agent/stage-18-opportunity-mvp
    paths:
      - .github/workflows/stage18-ledger-once.yml

permissions:
  contents: write

jobs:
  append-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Append Stage 18 verification entry once
        run: |
          if grep -q "Stage 18 Curated Opportunity MVP verified candidate" docs/implementation/ledger.md; then
            exit 0
          fi
          cat docs/implementation/.stage18-ledger-entry.tmp >> docs/implementation/ledger.md
      - name: Commit ledger entry
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/ledger.md
          git commit -m "docs(stage18): record verified candidate in ledger"
          git push
