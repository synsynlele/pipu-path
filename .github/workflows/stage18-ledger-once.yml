name: Stage18 helper cleanup

on:
  push:
    branches:
      - agent/stage-18-opportunity-mvp
    paths:
      - .github/workflows/stage18-ledger-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove temporary Stage 18 helper files
        run: |
          git rm .github/workflows/stage18-ledger-once.yml
          git rm docs/implementation/.stage18-ledger-entry.tmp
          git rm .github/.stage18-cleanup-marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stage18): clean temporary verification helpers"
          git push
