name: Stage 16 E2E formatter

on:
  push:
    branches:
      - agent/stage-16-living-builder-profile
    paths:
      - ".github/workflows/stage16-e2e-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-16-living-builder-profile
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/stage16-living-builder-profile.spec.ts
      - name: Commit formatting and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/stage16-e2e-format.yml
          git add -A
          git commit -m "chore(stage16): format Preview proof"
          git push origin HEAD:agent/stage-16-living-builder-profile
