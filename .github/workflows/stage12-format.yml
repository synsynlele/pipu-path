name: Stage 12 format patch

on:
  push:
    branches:
      - agent/stage12-economic-pathways-mvp

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage12-economic-pathways-mvp
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit canonical formatting and remove temporary workflow
        run: |
          rm .github/workflows/stage12-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(stage12): apply canonical formatting"
          git push origin HEAD:agent/stage12-economic-pathways-mvp
