name: Stage 21 Tests Format Once

on:
  push:
    branches:
      - agent/stage-21-builder-passport-api

permissions:
  contents: write

jobs:
  format:
    if: "${{ !startsWith(github.event.head_commit.message, 'style(stage21): format coverage tests') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-21-builder-passport-api
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            src/modules/passport/application/passport-actions.test.ts \
            src/modules/passport/infrastructure/passport-dal.test.ts \
            src/modules/passport/infrastructure/passport-security.test.ts \
            src/modules/passport/ui/public-passport-share.test.tsx
      - name: Commit formatting and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/stage21-tests-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/passport/application/passport-actions.test.ts src/modules/passport/infrastructure/passport-dal.test.ts src/modules/passport/infrastructure/passport-security.test.ts src/modules/passport/ui/public-passport-share.test.tsx .github/workflows/stage21-tests-format-once.yml
          git commit -m "style(stage21): format coverage tests"
          git push origin HEAD:agent/stage-21-builder-passport-api
