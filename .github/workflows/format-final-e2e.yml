name: Format final E2E checks

on:
  push:
    branches:
      - agent/stage10-mvp-launch-readiness
    paths:
      - .github/workflows/format-final-e2e.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage10-mvp-launch-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/quest.spec.ts tests/e2e/stage9-portfolio.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/quest.spec.ts tests/e2e/stage9-portfolio.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(e2e): format final release checks"
          git push origin HEAD:agent/stage10-mvp-launch-readiness
