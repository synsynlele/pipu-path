name: Stage 28 Canonical Format Helper

on:
  push:
    branches:
      - stage-28-pipupath-lite-production-bootstrap
    paths:
      - ".github/workflows/stage-28-publish-apk-blob.yml"

permissions:
  contents: read

jobs:
  format-download-page:
    name: Canonically format Stage 28 download page
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Stage 28 release branch
        uses: actions/checkout@v5
        with:
          ref: stage-28-pipupath-lite-production

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format download page with repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          npx prettier src/app/download/page.tsx --write
          npx prettier src/app/download/page.tsx --check
          echo "PIPUPATH_FORMATTED_PAGE_BASE64_BEGIN"
          base64 -w 0 src/app/download/page.tsx
          echo
          echo "PIPUPATH_FORMATTED_PAGE_BASE64_END"
