name: Stage 28 Canonical Format Helper

on:
  push:
    branches:
      - stage-28-pipupath-lite-production-bootstrap
    paths:
      - ".github/workflows/stage-28-publish-apk-blob.yml"

permissions:
  contents: write

jobs:
  format-download-page:
    name: Canonically format Stage 28 download page
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Stage 28 release branch
        uses: actions/checkout@v5
        with:
          ref: stage-28-pipupath-lite-production

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format download page with repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          npx prettier src/app/download/page.tsx --write
          npx prettier src/app/download/page.tsx --check

      - name: Create Git blob from canonical page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          page = Path("src/app/download/page.tsx")
          payload = json.dumps(
              {
                  "content": base64.b64encode(page.read_bytes()).decode("ascii"),
                  "encoding": "base64",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/blobs",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          print(f"PIPUPATH_FORMATTED_PAGE_BLOB_SHA={result['sha']}")
          PY
