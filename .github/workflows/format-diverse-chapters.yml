name: Format diverse chapters candidate once
on:
  push:
    branches: [feat/diverse-chapters-repeatable-builder-shop-20261031]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/diverse-chapters-repeatable-builder-shop-20261031
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format feature files
        run: |
          npx --no-install prettier --write \
            docs/implementation/status.md \
            public/games/city/advanced-challenges.mjs \
            public/games/city/advanced-challenges.css \
            public/games/city/advanced-legacy.mjs \
            public/games/city/advanced.mjs \
            public/games/city/advanced-ui.mjs \
            public/games/city/builder-rewards.mjs \
            public/games/city/builder-rewards-ui.mjs \
            public/games/city/builder-cosmetics.mjs \
            public/games/city/game.mjs \
            public/games/city/index.html \
            scripts/power-district/advanced.mjs \
            scripts/power-district/builder-rewards.mjs
      - name: Commit formatting and remove this temporary workflow
        run: |
          git config user.name "PipuPath CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/format-diverse-chapters.yml
          git add docs/implementation/status.md public/games/city scripts/power-district/advanced.mjs scripts/power-district/builder-rewards.mjs
          git commit -m "style: format advanced challenges and retire temporary formatter"
          git push origin HEAD:refs/heads/feat/diverse-chapters-repeatable-builder-shop-20261031
