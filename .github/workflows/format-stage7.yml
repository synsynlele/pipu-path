name: Format Stage 7

on:
  push:
    branches:
      - agent/stage7-hqls-quest-execution
    paths:
      - .github/workflows/format-stage7.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage7-hqls-quest-execution
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(stage7): apply repository formatting"
            git push origin HEAD:agent/stage7-hqls-quest-execution
          fi
