name: Format Chapter 4 preview (temporary)
on:
  push:
    branches:
      - preview/chapter-four-rescue-lab
    paths:
      - .github/workflows/format-ch4-preview.yml
permissions:
  contents: read
jobs:
  formatting-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only affected Chapter 4 files
        run: |
          npx prettier --write \
            docs/product/unbuilt-city-chapter-four.md \
            public/games/city/game.mjs \
            public/games/city/index.html \
            public/games/city/resilience.mjs \
            scripts/power-district/city-ui.mjs
      - name: Publish formatted source for review
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          const paths = [
            "docs/product/unbuilt-city-chapter-four.md",
            "public/games/city/game.mjs",
            "public/games/city/index.html",
            "public/games/city/resilience.mjs",
            "scripts/power-district/city-ui.mjs",
          ];
          for (const path of paths) {
            console.log("CH4_FORMAT:" + JSON.stringify({path,content:readFileSync(path,"utf8")}));
          }
          JS
