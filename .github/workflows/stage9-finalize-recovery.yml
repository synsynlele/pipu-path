name: Stage 9 recovery fixes

on:
  push:
    branches:
      - agent/stage9-selective-project-portfolio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9-selective-project-portfolio
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply recovery fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          discovery = Path('tests/e2e/discovery.spec.ts')
          text = discovery.read_text()
          old = '''  await page.goto("/onboarding/discovery");
          const persistedCompletion = page.getByRole("link", {
          '''
          new = '''  await page.goto("/onboarding/discovery");
          await page.locator("#main-content").waitFor({ state: "visible" });
          const persistedCompletion = page.getByRole("link", {
          '''
          if old not in text:
              raise SystemExit('Discovery recovery insertion point not found')
          discovery.write_text(text.replace(old, new, 1))

          portfolio = Path('tests/e2e/stage9-portfolio.spec.ts')
          text = portfolio.read_text()
          old = '''  const publicLink = page.getByRole("link", { name: "View Public Proof" });
          await expect(publicLink).toBeVisible();
          await publicLink.click();
          '''
          new = '''  let publicLink = page.getByRole("link", {
            name: "View Public Proof",
            exact: true,
          });
          if ((await publicLink.count()) === 0) {
            await page
              .getByRole("link", {
                name: /Continue Portfolio Studio|Manage Public Proof/,
              })
              .first()
              .click();
            const previewExisting = page.getByRole("link", {
              name: "Preview Existing Draft",
            });
            await expect(previewExisting).toBeVisible();
            await previewExisting.click();
            await publishFromPreview(page);
            await page.goto("/portfolio");
            publicLink = page.getByRole("link", {
              name: "View Public Proof",
              exact: true,
            });
          }
          await expect(publicLink).toBeVisible();
          await publicLink.click();
          '''
          if old not in text:
              raise SystemExit('Portfolio mobile recovery insertion point not found')
          portfolio.write_text(text.replace(old, new, 1))

          contract = Path('tests/integration/stage-9-contract.test.ts')
          text = contract.read_text()
          marker = '''const publicPage = readFileSync("src/app/proof/[slug]/page.tsx", "utf8");
          '''
          replacement = '''const publicPage = readFileSync("src/app/proof/[slug]/page.tsx", "utf8");
          const publicUnavailablePage = readFileSync(
            "src/app/proof-unavailable/page.tsx",
            "utf8",
          );
          const proxy = readFileSync("src/proxy.ts", "utf8");
          '''
          if marker not in text:
              raise SystemExit('Stage 9 contract import insertion point not found')
          text = text.replace(marker, replacement, 1)
          old = '''    expect(actions).toContain("revalidatePath(`/proof/${portfolio.slug}`)");
            });
          '''
          new = '''    expect(actions).toContain("revalidatePath(`/proof/${portfolio.slug}`)");
              expect(proxy).toContain("get_stage9_public_portfolio");
              expect(proxy).toContain(
                "NextResponse.rewrite(destination, { status: 404 })",
              );
              expect(publicUnavailablePage).toContain(
                "This Project proof is not public.",
              );
            });
          '''
          if old not in text:
              raise SystemExit('Stage 9 contract assertion insertion point not found')
          contract.write_text(text.replace(old, new, 1))
          PY
      - run: npx prettier --write tests/e2e/discovery.spec.ts tests/e2e/stage9-portfolio.spec.ts tests/integration/stage-9-contract.test.ts
      - run: npm run typecheck && npm run test:integration
      - name: Commit clean recovery fix
        run: |
          git rm .github/workflows/stage9-finalize-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/discovery.spec.ts tests/e2e/stage9-portfolio.spec.ts tests/integration/stage-9-contract.test.ts
          git commit -m "test(stage9): harden live recovery coverage"
          git push origin HEAD:agent/stage9-selective-project-portfolio
