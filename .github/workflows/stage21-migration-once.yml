name: Stage 21 Migration Once

on:
  push:
    branches:
      - agent/stage-21-builder-passport-api

permissions:
  contents: write

jobs:
  generate:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(stage21): generate migration') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-21-builder-passport-api
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase migration new stage_21_builder_passport_api
      - name: Commit generated migration and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/stage21-migration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations .github/workflows/stage21-migration-once.yml
          git commit -m "chore(stage21): generate migration"
          git push origin HEAD:agent/stage-21-builder-passport-api
