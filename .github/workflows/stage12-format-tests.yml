name: Stage 12 format coverage tests

on:
  push:
    branches:
      - agent/stage12-economic-pathways-mvp

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage12-economic-pathways-mvp
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/modules/journey/application/journey-fallback.test.ts src/modules/journey/domain/journey-contract.test.ts src/modules/mission/application/mission-fallback.test.ts
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/stage12-format-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(stage12): format coverage tests"
          git push origin HEAD:agent/stage12-economic-pathways-mvp
