name: Format Phase 2 Preview (temporary)
on:
  push:
    branches:
      - preview/game-world-class-phase2
    paths:
      - .github/workflows/format-phase2-preview.yml
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Phase 2 changed sources
        run: |
          npx prettier --write \
            public/games/city/build-lab.mjs \
            public/games/city/build-lab-ui.mjs \
            public/games/city/build-milestone-scene.mjs \
            public/games/city/build-progression.mjs \
            public/games/city/city-service-system.mjs \
            public/games/city/city-service-ui.mjs \
            public/games/city/game.mjs \
            public/games/city/index.html \
            public/games/shared/city-theme.css \
            scripts/power-district/city-service-system.mjs \
            scripts/power-district/build-lab.mjs \
            scripts/power-district/build-milestones.mjs \
            scripts/power-district/city-ui.mjs \
            scripts/power-district/runtime-layout.mjs \
            docs/product/pipupath-world-class-game-roadmap.md \
            package.json
      - name: Print formatted sources for integration
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          const files = ["public/games/city/build-lab.mjs","public/games/city/build-lab-ui.mjs","public/games/city/build-milestone-scene.mjs","public/games/city/build-progression.mjs","public/games/city/city-service-system.mjs","public/games/city/city-service-ui.mjs","public/games/city/game.mjs","public/games/city/index.html","public/games/shared/city-theme.css","scripts/power-district/city-service-system.mjs","scripts/power-district/build-lab.mjs","scripts/power-district/build-milestones.mjs","scripts/power-district/city-ui.mjs","scripts/power-district/runtime-layout.mjs","docs/product/pipupath-world-class-game-roadmap.md","package.json"];
          for (const path of files) {
            console.log("PHASE2_FMT:" + JSON.stringify({path,content:readFileSync(path,"utf8")}));
          }
          JS
