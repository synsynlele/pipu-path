name: Stage 20 Hardening Migration Once

on:
  push:
    branches:
      - agent/stage-20-opportunity-marketplace

permissions:
  contents: write

jobs:
  create-migration:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(stage20): create hardening migration shell') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-20-opportunity-marketplace
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create Stage 20 hardening migration
        run: npx --no-install supabase migration new harden_stage_20_marketplace_privacy
      - name: Commit migration shell and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/stage20-hardening-migration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations .github/workflows/stage20-hardening-migration-once.yml
          git commit -m "chore(stage20): create hardening migration shell"
          git push origin HEAD:agent/stage-20-opportunity-marketplace
