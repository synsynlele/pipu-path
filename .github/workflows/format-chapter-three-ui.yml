name: Format Chapter 3 UI test correction
on:
  pull_request:
    branches: [feat/unbuilt-city-living-beautiful-world]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-chapter-three-enterprises'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-chapter-three-enterprises
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/power-district/city-ui.mjs .github/workflows/format-chapter-three-ui.yml
      - name: Commit if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/power-district/city-ui.mjs .github/workflows/format-chapter-three-ui.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format Chapter 3 UI regression"
            git push origin HEAD:feat/unbuilt-city-chapter-three-enterprises
          fi
