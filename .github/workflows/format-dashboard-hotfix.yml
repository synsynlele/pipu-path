name: Format dashboard hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format dashboard source
        run: npx prettier src/app/app/page.tsx > /tmp/page.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-dashboard
          path: /tmp/page.tsx
          if-no-files-found: error
