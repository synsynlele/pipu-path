name: Apply formatting

on:
  push:
    branches:
      - agent/stage10-mvp-launch-readiness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage10-mvp-launch-readiness
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply Prettier
        run: >-
          npx prettier --write
          src/app/globals.css
          src/components/brand/brand-mark.tsx
          src/components/feedback/page-loading.tsx
          src/modules/discovery/ui/discovery-question-form.tsx
          src/modules/human-potential/infrastructure/gemini-provider.ts
          src/modules/human-potential/ui/profile-generation-form.tsx
          src/modules/identity/ui/checkpoint-form.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/globals.css src/components/brand/brand-mark.tsx src/components/feedback/page-loading.tsx src/modules/discovery/ui/discovery-question-form.tsx src/modules/human-potential/infrastructure/gemini-provider.ts src/modules/human-potential/ui/profile-generation-form.tsx src/modules/identity/ui/checkpoint-form.tsx
          git commit -m "style(stage10): apply Prettier formatting"
          git push origin HEAD:agent/stage10-mvp-launch-readiness
