name: Stage 17 status formatter

on:
  push:
    branches:
      - agent/stage-17-ai-personal-builder-guide
    paths:
      - ".github/workflows/stage17-status-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-17-ai-personal-builder-guide
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/implementation/status.md PROJECT_STATE.md docs/implementation/stage-17-ai-personal-builder-guide.md docs/architecture/adr-stage-17-ai-personal-builder-guide.md
      - name: Commit formatting and remove formatter
        run: |
          rm .github/workflows/stage17-status-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(stage17): format stage documentation"
          git push origin HEAD:agent/stage-17-ai-personal-builder-guide
