name: Stage 19 Format Once

on:
  push:
    branches:
      - agent/stage-19-institution-workspace

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'style(stage19): apply repository Prettier') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-19-institution-workspace
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/stage19-institution-workspace.spec.ts
      - name: Commit exact repository formatting
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/e2e/stage19-institution-workspace.spec.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/stage19-institution-workspace.spec.ts
          git commit -m "style(stage19): apply repository Prettier"
          git push origin HEAD:agent/stage-19-institution-workspace
