name: Format Chapter 3 enterprise preview
on:
  pull_request:
    branches: [feat/unbuilt-city-living-beautiful-world]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-chapter-three-enterprises'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-chapter-three-enterprises
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format Chapter 3 modules, game and tests
        run: npx prettier --write public/games/city/opportunities.mjs public/games/city/index.html public/games/city/practice-save.mjs public/games/city/living-city.mjs public/games/city/living-scene.mjs public/games/city/game.mjs public/games/shared/city-theme.css scripts/power-district/opportunities.mjs scripts/power-district/practice-save.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md docs/product/unbuilt-city-chapter-three.md .github/workflows/format-enterprise-chapter.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/opportunities.mjs public/games/city/index.html public/games/city/practice-save.mjs public/games/city/living-city.mjs public/games/city/living-scene.mjs public/games/city/game.mjs public/games/shared/city-theme.css scripts/power-district/opportunities.mjs scripts/power-district/practice-save.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md docs/product/unbuilt-city-chapter-three.md .github/workflows/format-enterprise-chapter.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format the Chapter 3 enterprise simulation"
            git push origin HEAD:feat/unbuilt-city-chapter-three-enterprises
          fi
