name: Format Unbuilt City preview
on:
  pull_request:
    branches: [feat/unbuilt-city-first-episode]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-guided-expanded'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-guided-expanded
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format preview changes
        run: npx prettier --write public/games/city/game.mjs public/games/city/index.html public/games/shared/city-theme.css docs/implementation/status.md docs/product/unbuilt-city-connected-world.md .github/workflows/format-unbuilt-city-preview.yml
      - name: Commit formatted files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/game.mjs public/games/city/index.html public/games/shared/city-theme.css docs/implementation/status.md docs/product/unbuilt-city-connected-world.md .github/workflows/format-unbuilt-city-preview.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format guided city preview"
            git push origin HEAD:feat/unbuilt-city-guided-expanded
          fi
