name: Stage 18 one-shot formatter

on:
  push:
    branches: [agent/stage-18-opportunity-mvp]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style(stage18): apply repository formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-18-opportunity-mvp
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format Stage 18 files
        run: >-
          npx prettier --write
          src/app/admin/layout.tsx
          src/app/admin/opportunities/page.tsx
          src/app/app/layout.tsx
          src/app/opportunities/page.tsx
          src/modules/opportunities/application/opportunity-actions.ts
          src/modules/opportunities/domain/opportunity-contract.test.ts
          src/modules/opportunities/domain/opportunity-contract.ts
          tests/integration/stage-18-opportunity-mvp.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name synsynlele
          git config user.email synsynlele@gmail.com
          git add src/app/admin/layout.tsx src/app/admin/opportunities/page.tsx src/app/app/layout.tsx src/app/opportunities/page.tsx src/modules/opportunities/application/opportunity-actions.ts src/modules/opportunities/domain/opportunity-contract.test.ts src/modules/opportunities/domain/opportunity-contract.ts tests/integration/stage-18-opportunity-mvp.test.ts
          git commit -m 'style(stage18): apply repository formatter'
          git push origin HEAD:agent/stage-18-opportunity-mvp
