name: Stage 21 Format Once

on:
  push:
    branches:
      - agent/stage-21-builder-passport-api

permissions:
  contents: write

jobs:
  format:
    if: "${{ !startsWith(github.event.head_commit.message, 'style(stage21): apply repository Prettier') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-21-builder-passport-api
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format Stage 21 surface
        run: |
          npx prettier --write \
            docs/implementation/route-map.md \
            src/app/passport/page.tsx \
            src/app/passport/preview/page.tsx \
            src/modules/passport/application/passport-actions.ts \
            src/modules/passport/domain/passport-contract.test.ts \
            src/modules/passport/domain/passport-contract.ts \
            src/modules/passport/ui/passport-issue-form.tsx \
            src/modules/passport/ui/passport-share-creator.tsx \
            src/modules/passport/ui/public-passport-share.tsx \
            tests/integration/stage-21-builder-passport-api.test.ts
      - name: Commit exact formatting and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/stage21-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/route-map.md src/app/passport/page.tsx src/app/passport/preview/page.tsx src/modules/passport/application/passport-actions.ts src/modules/passport/domain/passport-contract.test.ts src/modules/passport/domain/passport-contract.ts src/modules/passport/ui/passport-issue-form.tsx src/modules/passport/ui/passport-share-creator.tsx src/modules/passport/ui/public-passport-share.tsx tests/integration/stage-21-builder-passport-api.test.ts .github/workflows/stage21-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(stage21): apply repository Prettier"
          git push origin HEAD:agent/stage-21-builder-passport-api
