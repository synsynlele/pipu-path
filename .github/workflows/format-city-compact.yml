name: Format compact city panel
on:
  pull_request:
    branches: [feat/unbuilt-city-chapter-two-all-districts]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-compact-decision-panel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-compact-decision-panel
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format compact city changes
        run: npx prettier --write public/games/city/game.mjs public/games/shared/city-theme.css scripts/power-district/city-ui.mjs docs/implementation/status.md .github/workflows/format-city-compact.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/game.mjs public/games/shared/city-theme.css scripts/power-district/city-ui.mjs docs/implementation/status.md .github/workflows/format-city-compact.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format compact city decision UI"
            git push origin HEAD:feat/unbuilt-city-compact-decision-panel
          fi
