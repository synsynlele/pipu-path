name: Stage 14 format

on:
  push:
    branches:
      - agent/stage14-living-profile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage14-living-profile
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/implementation/status.md src/app/onboarding/discovery/profile/page.tsx src/modules/human-potential/application/profile-actions.ts tests/integration/stage-14-living-profile.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/status.md src/app/onboarding/discovery/profile/page.tsx src/modules/human-potential/application/profile-actions.ts tests/integration/stage-14-living-profile.test.ts
          git commit -m "style(stage14): apply validated formatting"
          git push origin HEAD:agent/stage14-living-profile
