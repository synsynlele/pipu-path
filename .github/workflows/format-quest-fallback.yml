name: Format Quest fallback

on:
  push:
    branches:
      - agent/stage10-mvp-launch-readiness
    paths:
      - .github/workflows/format-quest-fallback.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage10-mvp-launch-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format Quest fallback file
        run: npx prettier --write src/modules/quest/application/quest-fallback.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/quest/application/quest-fallback.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(quest): format fallback implementation"
          git push origin HEAD:agent/stage10-mvp-launch-readiness
