name: Stage 20 Vercel Credential Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  credential:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify Vercel deployment credential exists without calling Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in this repository. No Vercel call was made."
            exit 1
          fi
          echo "Vercel credential is configured; no Vercel call was made by this check."
