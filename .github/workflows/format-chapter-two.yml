name: Format Unbuilt City Chapter 2
on:
  pull_request:
    branches: [feat/unbuilt-city-navigation-and-revision]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-chapter-two-all-districts'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-chapter-two-all-districts
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format Chapter 2 files
        run: npx prettier --write public/games/city/chapter-two.mjs public/games/city/cases.mjs public/games/city/districts.mjs public/games/city/feedback.mjs public/games/city/scene-feedback.mjs public/games/city/city-growth.mjs public/games/city/journey-flow.mjs public/games/city/game.mjs public/games/city/index.html public/games/shared/city-theme.css scripts/power-district/districts.mjs scripts/power-district/cases.mjs scripts/power-district/auto-flow.mjs scripts/power-district/city-growth.mjs scripts/power-district/action-feedback.mjs scripts/power-district/journey-resume.mjs scripts/power-district/city-ui.mjs scripts/power-district/chapter-two.mjs docs/implementation/status.md docs/product/unbuilt-city-chapter-two.md .github/workflows/format-chapter-two.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/chapter-two.mjs public/games/city/cases.mjs public/games/city/districts.mjs public/games/city/feedback.mjs public/games/city/scene-feedback.mjs public/games/city/city-growth.mjs public/games/city/journey-flow.mjs public/games/city/game.mjs public/games/city/index.html public/games/shared/city-theme.css scripts/power-district/districts.mjs scripts/power-district/cases.mjs scripts/power-district/auto-flow.mjs scripts/power-district/city-growth.mjs scripts/power-district/action-feedback.mjs scripts/power-district/journey-resume.mjs scripts/power-district/city-ui.mjs scripts/power-district/chapter-two.mjs docs/implementation/status.md docs/product/unbuilt-city-chapter-two.md .github/workflows/format-chapter-two.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format Chapter 2 across all districts"
            git push origin HEAD:feat/unbuilt-city-chapter-two-all-districts
          fi
