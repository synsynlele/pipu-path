name: Stage 11 focused gate

on:
  workflow_dispatch:
  push:
    branches: [agent/stage11-connect-continuity]

permissions:
  contents: write

concurrency:
  group: stage11-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage11-connect-continuity
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: npm run format
      - name: Commit formatting when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style(stage11): apply repository formatting [skip-preview]"
            git push
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run src/modules/connect/domain/connect-contract.test.ts
      - run: npx vitest run --config vitest.integration.config.ts tests/integration/stage-11-connect-continuity.test.ts
      - run: npm run build
