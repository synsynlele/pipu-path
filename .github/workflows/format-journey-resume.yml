name: Format Unbuilt City journey resume
on:
  pull_request:
    branches: [feat/unbuilt-city-choice-to-city]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-journey-resume'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-journey-resume
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changes
        run: npx prettier --write public/games/city/game.mjs public/games/city/index.html public/games/city/journey-flow.mjs public/games/city/practice-save.mjs public/games/shared/city-theme.css scripts/power-district/city-ui.mjs scripts/power-district/journey-resume.mjs scripts/power-district/practice-save.mjs docs/implementation/status.md docs/product/unbuilt-city-resume-controller.md .github/workflows/format-journey-resume.yml
      - name: Commit formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/game.mjs public/games/city/index.html public/games/city/journey-flow.mjs public/games/city/practice-save.mjs public/games/shared/city-theme.css scripts/power-district/city-ui.mjs scripts/power-district/journey-resume.mjs scripts/power-district/practice-save.mjs docs/implementation/status.md docs/product/unbuilt-city-resume-controller.md .github/workflows/format-journey-resume.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format journey resume controls"
            git push origin HEAD:feat/unbuilt-city-journey-resume
          fi
