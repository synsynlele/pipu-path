name: Format New City DOM Tests
on:
  push:
    branches:
      - feat/varied-city-challenges-repeatable-decor-20261031
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/varied-city-challenges-repeatable-decor-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/varied-city-challenges-repeatable-decor-20261031
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format DOM test updates
        run: npx --no-install prettier --write scripts/power-district/runtime-layout.mjs scripts/power-district/advanced-dom-helpers.mjs
      - name: Commit formatting
        run: |
          git config user.name "PipuPath CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/power-district/runtime-layout.mjs scripts/power-district/advanced-dom-helpers.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format varied chapter DOM regression tests"
            git push origin HEAD:refs/heads/feat/varied-city-challenges-repeatable-decor-20261031
          fi
