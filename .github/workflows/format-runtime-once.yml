name: Temporary Format Linked Runtime
on:
  push:
    branches:
      - preview/game-world-class-phase2
    paths:
      - .github/workflows/format-runtime-once.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write scripts/power-district/runtime-layout.mjs
      - name: Print formatted test source
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          console.log("FORMATTED_TEST:" + JSON.stringify(readFileSync("scripts/power-district/runtime-layout.mjs","utf8")));
          JS
