name: Format Chapter 2 calibration
on:
  pull_request:
    branches: [feat/unbuilt-city-navigation-and-revision]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-chapter-two-all-districts'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-chapter-two-all-districts
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format targeted fixes
        run: npx prettier --write public/games/city/city-growth.mjs public/games/city/game.mjs .github/workflows/format-chapter-two-fixes.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/city-growth.mjs public/games/city/game.mjs .github/workflows/format-chapter-two-fixes.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format Chapter 2 calibrated service model"
            git push origin HEAD:feat/unbuilt-city-chapter-two-all-districts
          fi
