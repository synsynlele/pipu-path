name: Stage 20 Fix Unused Import Once

on:
  push:
    branches:
      - agent/stage-20-opportunity-marketplace

permissions:
  contents: write

jobs:
  fix:
    if: "${{ !startsWith(github.event.head_commit.message, 'fix(stage20): remove unused marketplace import') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-20-opportunity-marketplace
      - name: Remove proven unused import
        run: sed -i '/^  opportunityProviderSchema,$/d' src/modules/opportunities/infrastructure/marketplace-dal.ts
      - name: Remove workflow and commit fix
        run: |
          set -euo pipefail
          rm .github/workflows/stage20-fix-unused-import-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/opportunities/infrastructure/marketplace-dal.ts .github/workflows/stage20-fix-unused-import-once.yml
          git commit -m "fix(stage20): remove unused marketplace import"
          git push origin HEAD:agent/stage-20-opportunity-marketplace
