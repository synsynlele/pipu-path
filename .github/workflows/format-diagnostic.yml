name: PWA Format Diagnostic

on:
  push:
    branches:
      - fix/desktop-pwa-install-only

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Print canonical Prettier diff
        run: |
          npx prettier --write src/components/pwa/install-prompt.tsx
          git diff -- src/components/pwa/install-prompt.tsx
