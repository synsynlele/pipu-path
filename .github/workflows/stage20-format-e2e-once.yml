name: Stage 20 Format E2E Once

on:
  push:
    branches:
      - agent/stage-20-opportunity-marketplace

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message != 'chore(stage20): apply e2e formatting' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-20-opportunity-marketplace
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no-install prettier --write tests/e2e/stage20-opportunity-marketplace.spec.ts
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/stage20-format-e2e-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/stage20-opportunity-marketplace.spec.ts .github/workflows/stage20-format-e2e-once.yml
          git commit -m "chore(stage20): apply e2e formatting"
          git push origin HEAD:agent/stage-20-opportunity-marketplace
