name: Stage 29 release formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-stage29-release:
    if: github.head_ref == 'agent/stage-29-builder-network'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format release files exactly
        run: >-
          npx prettier --write
          'src/app/connect/world/page.tsx'
          'src/components/navigation/app-navigation.test.tsx'
          'tests/integration/stage-29-builder-network.test.ts'
      - name: Remove temporary formatter
        run: rm .github/workflows/stage29-release-format.yml
      - name: Commit exact formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/connect/world/page.tsx src/components/navigation/app-navigation.test.tsx tests/integration/stage-29-builder-network.test.ts .github/workflows/stage29-release-format.yml
          git commit -m 'Format Stage 29 release candidate'
          git push origin HEAD:${{ github.head_ref }}
