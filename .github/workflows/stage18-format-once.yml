name: Stage18 format once

on:
  push:
    branches:
      - agent/stage-18-opportunity-mvp
    paths:
      - .github/workflows/stage18-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec prettier -- --write tests/e2e/stage18-opportunity-mvp.spec.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/stage18-opportunity-mvp.spec.ts
          git commit -m "style(stage18): format browser proof"
          git push
