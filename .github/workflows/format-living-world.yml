name: Format living city preview
on:
  pull_request:
    branches: [feat/unbuilt-city-player-city-view]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-living-beautiful-world'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-living-beautiful-world
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format living city files
        run: npx prettier --write public/games/city/living-city.mjs public/games/city/living-scene.mjs public/games/city/game.mjs scripts/power-district/living-city.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md docs/product/unbuilt-city-living-world.md .github/workflows/format-living-world.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/living-city.mjs public/games/city/living-scene.mjs public/games/city/game.mjs scripts/power-district/living-city.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md docs/product/unbuilt-city-living-world.md .github/workflows/format-living-world.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format the living city scene and tests"
            git push origin HEAD:feat/unbuilt-city-living-beautiful-world
          fi
