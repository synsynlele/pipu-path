name: Format Stage 7 Status

on:
  push:
    branches:
      - agent/stage7-hqls-quest-execution
    paths:
      - .github/workflows/format-stage7-status.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage7-hqls-quest-execution
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/implementation/status.md
      - name: Commit formatted status
        run: |
          rm .github/workflows/format-stage7-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/status.md .github/workflows/format-stage7-status.yml
          git commit -m "style(stage7): format closure status"
          git push origin HEAD:agent/stage7-hqls-quest-execution
