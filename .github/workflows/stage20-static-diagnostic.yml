name: Stage 20 Static Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  stage20-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Stage 20 integration file only
        run: npx vitest run --config vitest.integration.config.ts tests/integration/stage-20-opportunity-marketplace.test.ts --reporter=verbose
