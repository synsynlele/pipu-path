name: Stage 20 Final Preview Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run Stage 20 authenticated browser proof against proven Preview
        run: npx playwright test tests/e2e/stage20-opportunity-marketplace.spec.ts --project=chromium
        env:
          E2E_BASE_URL: "https://pipu-path-4xev4onlk-copyartint-2860s-projects.vercel.app"
          E2E_STAGE3_EMAIL: ${{ secrets.E2E_STAGE3_EMAIL }}
          E2E_STAGE3_PASSWORD: ${{ secrets.E2E_STAGE3_PASSWORD }}
          E2E_STAGE20_EXPECT_MARKETPLACE: "true"
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage20-final-preview-proof-traces
          path: test-results
          if-no-files-found: ignore
