name: Format fourteen-district preview
on:
  pull_request:
    branches: [feat/unbuilt-city-living-visuals]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-fourteen-districts'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-fourteen-districts
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write public/games/city/districts.mjs public/games/city/game.mjs public/games/city/index.html public/games/shared/city-theme.css public/games/shared/navigation.mjs scripts/power-district/city-ui.mjs scripts/power-district/districts.mjs docs/implementation/status.md docs/product/unbuilt-city-districts.md .github/workflows/format-fourteen-districts.yml
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/districts.mjs public/games/city/game.mjs public/games/city/index.html public/games/shared/city-theme.css public/games/shared/navigation.mjs scripts/power-district/city-ui.mjs scripts/power-district/districts.mjs docs/implementation/status.md docs/product/unbuilt-city-districts.md .github/workflows/format-fourteen-districts.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format fourteen-district preview"
            git push origin HEAD:feat/unbuilt-city-fourteen-districts
          fi
