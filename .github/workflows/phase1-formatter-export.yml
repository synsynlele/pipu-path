name: Phase 1 read-only formatting export
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    if: github.head_ref == 'agent/pipupath-phase1-financial-intelligence'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only Phase 1 changed files without modifying GitHub
        run: npm exec -- prettier --write "docs/implementation/ledger.md" "docs/implementation/status.md" "src/app/journey/page.tsx" "src/app/real-quests/[buildId]/page.tsx" "src/app/real-quests/finance/page.tsx" "src/app/real-quests/page.tsx" "src/modules/builder-intelligence/application/financial-actions.test.ts" "src/modules/builder-intelligence/application/financial-actions.ts" "src/modules/builder-intelligence/domain/builder-pathway.ts" "src/modules/builder-intelligence/domain/financial-pathway.test.ts" "src/modules/builder-intelligence/domain/financial-pathway.ts" "src/modules/builder-intelligence/infrastructure/financial-dal.ts" "src/modules/builder-intelligence/ui/financial-pathway-experience.tsx"
      - name: Print reviewed public source for read-only transfer
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const files = ["docs/implementation/ledger.md","docs/implementation/status.md","src/app/journey/page.tsx","src/app/real-quests/[buildId]/page.tsx","src/app/real-quests/finance/page.tsx","src/app/real-quests/page.tsx","src/modules/builder-intelligence/application/financial-actions.test.ts","src/modules/builder-intelligence/application/financial-actions.ts","src/modules/builder-intelligence/domain/builder-pathway.ts","src/modules/builder-intelligence/domain/financial-pathway.test.ts","src/modules/builder-intelligence/domain/financial-pathway.ts","src/modules/builder-intelligence/infrastructure/financial-dal.ts","src/modules/builder-intelligence/ui/financial-pathway-experience.tsx"];
          for (const path of files) {
            console.log("PHASE1_FORMAT_FILE=" + JSON.stringify({path,content:fs.readFileSync(path,"utf8")}));
          }
          NODE
