name: Stage 9 Publish Once

on:
  push:
    branches:
      - agent/stage9-selective-project-portfolio

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage9-selective-project-portfolio
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore reviewed Stage 9 implementation
        shell: bash
        run: |
          cat > /tmp/stage9_payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/stage9_payload.b64 > /tmp/stage9_payload.tar.gz
          tar -xzf /tmp/stage9_payload.tar.gz -C .
          rm -f .github/workflows/stage9-publish-once.yml
      - run: npm ci
      - name: Verify reviewed slice
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run test:integration
      - name: Commit Stage 9 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Stage 9 changes required."
          else
            git commit -m "feat(stage9): build selective Project portfolio"
            git push origin HEAD:agent/stage9-selective-project-portfolio
          fi
