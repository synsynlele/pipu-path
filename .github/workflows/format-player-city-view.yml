name: Format player city-view preview
on:
  pull_request:
    branches: [feat/unbuilt-city-compact-decision-panel]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/unbuilt-city-player-city-view'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/unbuilt-city-player-city-view
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format inspected-city changes
        run: npx prettier --write public/games/city/city-view.mjs public/games/city/index.html public/games/city/game.mjs public/games/shared/city-theme.css scripts/power-district/city-view.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md docs/product/unbuilt-city-aerial-inspection.md .github/workflows/format-player-city-view.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/city/city-view.mjs public/games/city/index.html public/games/city/game.mjs public/games/shared/city-theme.css scripts/power-district/city-view.mjs scripts/power-district/city-ui.mjs docs/implementation/status.md docs/product/unbuilt-city-aerial-inspection.md .github/workflows/format-player-city-view.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format player's aerial city inspection"
            git push origin HEAD:feat/unbuilt-city-player-city-view
          fi
