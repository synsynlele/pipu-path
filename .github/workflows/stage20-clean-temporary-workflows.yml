name: Stage 20 Clean Temporary Workflows

on:
  push:
    branches:
      - agent/stage-20-opportunity-marketplace

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(stage20): remove temporary workflow helpers') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-20-opportunity-marketplace
      - name: Remove temporary Stage 20 workflow helpers
        run: |
          rm -f .github/workflows/stage20-static-diagnostic.yml
          rm -f .github/workflows/stage20-split-migrations-once.yml
          rm -f .github/workflows/stage20-clean-temporary-workflows.yml
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "No temporary helpers remain."
            exit 0
          fi
          git commit -m "chore(stage20): remove temporary workflow helpers"
          git push origin HEAD:agent/stage-20-opportunity-marketplace
