name: Phase 1 single-file Prettier export
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format-ui:
    if: github.head_ref == 'agent/pipupath-phase1-financial-intelligence'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec -- prettier --write src/modules/builder-intelligence/ui/financial-pathway-experience.tsx
      - name: Return exact formatted public source
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "src/modules/builder-intelligence/ui/financial-pathway-experience.tsx";
          console.log("PHASE1_UI_FORMAT=" + JSON.stringify({path,content:fs.readFileSync(path,"utf8")}));
          NODE
