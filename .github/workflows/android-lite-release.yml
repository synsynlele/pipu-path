name: PipuPath Lite Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-lite-icon-refresh
    paths:
      - android-lite/RELEASE_NOW

permissions:
  contents: write

concurrency:
  group: pipupath-lite-production-release
  cancel-in-progress: false

jobs:
  build-production-release:
    name: Build signed PipuPath Lite production release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require protected production signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing PIPUPATH_ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing PIPUPATH_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing PIPUPATH_ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Verify permanent signing contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("android-lite/twa-manifest.production.json").read_text())
          assetlinks = json.loads(Path("public/.well-known/assetlinks.json").read_text())

          package_id = manifest["packageId"]
          fingerprints = manifest.get("fingerprints", [])
          assert len(fingerprints) == 1, "Production manifest must pin exactly one signing certificate."
          expected = fingerprints[0]["value"].upper()

          matches = [
              item for item in assetlinks
              if item.get("target", {}).get("namespace") == "android_app"
              and item.get("target", {}).get("package_name") == package_id
          ]
          assert len(matches) == 1, f"Expected exactly one assetlinks entry for {package_id}."
          linked = [value.upper() for value in matches[0]["target"].get("sha256_cert_fingerprints", [])]
          assert linked == [expected], (
              "assetlinks.json and twa-manifest.production.json must pin the same production certificate."
          )
          print(f"Permanent signing contract verified for {package_id}: {expected}")
          PY

      - name: Verify production PWA contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://www.pipupath.name.ng/manifest.webmanifest \
            --output /tmp/pipupath-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/pipupath-manifest.json").read_text())
          assert manifest["start_url"] == "/continue"
          assert manifest["display"] == "standalone"
          assert manifest["scope"] == "/"
          sizes = {icon.get("sizes") for icon in manifest.get("icons", [])}
          assert "192x192" in sizes
          assert "512x512" in sizes
          sources = {icon.get("src") for icon in manifest.get("icons", [])}
          assert "/brand/pipupath-icon-192.png" in sources
          assert "/brand/pipupath-icon-512.png" in sources
          print("PipuPath production PWA contract verified.")
          PY

      - name: Prepare production Android project and signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          rm -rf android-lite/generated-production android-lite/dist-production
          mkdir -p android-lite/generated-production android-lite/dist-production
          cp android-lite/twa-manifest.production.json \
            android-lite/generated-production/twa-manifest.json
          printf '%s' "$KEYSTORE_B64" | base64 --decode \
            > android-lite/generated-production/pipupath-lite-production.keystore

      - name: Verify production signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          FINGERPRINT="$(keytool -list -v \
            -keystore android-lite/generated-production/pipupath-lite-production.keystore \
            -alias pipupath-lite \
            -storepass "$KEYSTORE_PASSWORD" \
            | awk -F': ' '/SHA256:/{print $2; exit}')"
          EXPECTED="$(python3 -c 'import json; print(json.load(open("android-lite/twa-manifest.production.json"))["fingerprints"][0]["value"])')"
          test "$FINGERPRINT" = "$EXPECTED" || {
            echo "Production signing certificate does not match the certificate pinned in the production manifest."
            echo "Expected: $EXPECTED"
            echo "Actual:   $FINGERPRINT"
            exit 1
          }
          echo "Production signing certificate verified."

      - name: Generate Android project with Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          bash android-lite/prepare-bubblewrap-icon.sh android-lite/generated-production
          docker run --rm \
            --network host \
            -v "${PWD}/android-lite/generated-production:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            update \
            --skipVersionUpgrade \
            --manifest=/workspace/twa-manifest.json

      - name: Build signed APK and Android App Bundle
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD \
            -e BUBBLEWRAP_KEY_PASSWORD \
            -v "${PWD}/android-lite/generated-production:/workspace" \
            -w /workspace \
            --entrypoint bash \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            -lc '
              set -eu
              SDK_ROOT=/root/.bubblewrap/android_sdk
              SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
              test -n "$SDKMANAGER"
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" \
                --sdk_root="$SDK_ROOT" \
                "platforms;android-36" \
                "build-tools;35.0.0" \
                "build-tools;36.1.0"
              bubblewrap build \
                --skipPwaValidation \
                --manifest=/workspace/twa-manifest.json \
                --signingKeyPath=/workspace/pipupath-lite-production.keystore \
                --signingKeyAlias=pipupath-lite
            '

      - name: Package release artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("android-lite/twa-manifest.production.json"))["appVersion"])')"
          VERSION_CODE="$(python3 -c 'import json; print(json.load(open("android-lite/twa-manifest.production.json"))["appVersionCode"])')"
          APK_NAME="PipuPath-Lite-${VERSION}.apk"

          test -f android-lite/generated-production/app-release-signed.apk
          test -f android-lite/generated-production/app-release-bundle.aab

          cp android-lite/generated-production/app-release-signed.apk \
            "android-lite/dist-production/${APK_NAME}"
          cp android-lite/generated-production/app-release-bundle.aab \
            "android-lite/dist-production/PipuPath-Lite-${VERSION}.aab"
          sha256sum android-lite/dist-production/* \
            > android-lite/dist-production/SHA256SUMS.txt

          mkdir -p public/downloads
          cp "android-lite/dist-production/${APK_NAME}" "public/downloads/${APK_NAME}"

          SHA256="$(sha256sum "public/downloads/${APK_NAME}" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c%s "public/downloads/${APK_NAME}")"
          DATE_UTC="$(date -u +%F)"

          VERSION="$VERSION" \
          VERSION_CODE="$VERSION_CODE" \
          APK_NAME="$APK_NAME" \
          SHA256="$SHA256" \
          SIZE_BYTES="$SIZE_BYTES" \
          DATE_UTC="$DATE_UTC" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "name": "PipuPath Lite",
              "version": os.environ["VERSION"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "packageId": "ng.name.pipupath.lite",
              "apk": f"/downloads/{os.environ['APK_NAME']}",
              "releasedAt": os.environ["DATE_UTC"],
              "sha256": os.environ["SHA256"],
              "sizeBytes": int(os.environ["SIZE_BYTES"]),
              "offline": False,
              "notes": [
                  "Production-signed Android Lite package.",
                  "Uses the permanent PipuPath app icon in Android launcher and installed-app surfaces.",
                  "Uses the same PWA experience as www.pipupath.name.ng."
              ]
          }
          Path("public/downloads/pipupath-lite.json").write_text(
              json.dumps(metadata, indent=2) + "\n"
          )
          PY

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed production build
        uses: actions/upload-artifact@v4
        with:
          name: pipupath-lite-production-${{ github.sha }}
          path: android-lite/dist-production/
          if-no-files-found: error
          retention-days: 14

      - name: Publish download files to release branch
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/
          if git diff --cached --quiet; then
            echo "No download changes to publish."
          else
            git commit -m "release(android): publish PipuPath Lite ${VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
