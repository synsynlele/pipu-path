name: PipuPath Lite Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-lite-icon-refresh
    paths:
      - android-lite/twa-manifest.production.json
      - .github/workflows/android-lite-release.yml

permissions:
  contents: read

concurrency:
  group: pipupath-lite-production-release
  cancel-in-progress: false

jobs:
  build-production-release:
    name: Build signed PipuPath Lite production release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require protected production signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing PIPUPATH_ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing PIPUPATH_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing PIPUPATH_ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Verify production PWA contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://www.pipupath.name.ng/manifest.webmanifest \
            --output /tmp/pipupath-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/pipupath-manifest.json").read_text())
          assert manifest["start_url"] == "/continue"
          assert manifest["display"] == "standalone"
          assert manifest["scope"] == "/"
          sizes = {icon.get("sizes") for icon in manifest.get("icons", [])}
          assert "192x192" in sizes
          assert "512x512" in sizes
          sources = {icon.get("src") for icon in manifest.get("icons", [])}
          assert "/brand/pipupath-icon-192.png" in sources
          assert "/brand/pipupath-icon-512.png" in sources
          print("PipuPath production PWA contract verified.")
          PY

      - name: Prepare production Android project and signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          rm -rf android-lite/generated-production android-lite/dist-production
          mkdir -p android-lite/generated-production android-lite/dist-production
          cp android-lite/twa-manifest.production.json \
            android-lite/generated-production/twa-manifest.json
          printf '%s' "$KEYSTORE_B64" | base64 --decode \
            > android-lite/generated-production/pipupath-lite-production.keystore

      - name: Verify production signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          FINGERPRINT="$(keytool -list -v \
            -keystore android-lite/generated-production/pipupath-lite-production.keystore \
            -alias pipupath-lite \
            -storepass "$KEYSTORE_PASSWORD" \
            | awk -F': ' '/SHA256:/{print $2; exit}')"
          EXPECTED="C6:53:47:58:AD:D0:F1:AB:9E:26:87:F5:C5:52:D8:B3:B3:6F:7C:77:30:4B:D5:EE:B6:A5:33:E4:C2:10:51:1A"
          test "$FINGERPRINT" = "$EXPECTED" || {
            echo "Production signing certificate does not match the pinned PipuPath Lite certificate."
            exit 1
          }

      - name: Generate Android project with Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/android-lite/generated-production:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            update \
            --skipVersionUpgrade \
            --manifest=/workspace/twa-manifest.json

      - name: Build signed APK and Android App Bundle
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.PIPUPATH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD \
            -e BUBBLEWRAP_KEY_PASSWORD \
            -v "${PWD}/android-lite/generated-production:/workspace" \
            -w /workspace \
            --entrypoint bash \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            -lc '
              set -eu
              SDK_ROOT=/root/.bubblewrap/android_sdk
              SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
              test -n "$SDKMANAGER"
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" \
                --sdk_root="$SDK_ROOT" \
                "platforms;android-36" \
                "build-tools;35.0.0" \
                "build-tools;36.1.0"
              bubblewrap build \
                --skipPwaValidation \
                --manifest=/workspace/twa-manifest.json \
                --signingKeyPath=/workspace/pipupath-lite-production.keystore \
                --signingKeyAlias=pipupath-lite
            '

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("android-lite/twa-manifest.production.json"))["appVersion"])')"
          test -f android-lite/generated-production/app-release-signed.apk
          test -f android-lite/generated-production/app-release-bundle.aab

          cp android-lite/generated-production/app-release-signed.apk \
            "android-lite/dist-production/PipuPath-Lite-${VERSION}.apk"
          cp android-lite/generated-production/app-release-bundle.aab \
            "android-lite/dist-production/PipuPath-Lite-${VERSION}.aab"
          sha256sum android-lite/dist-production/* \
            > android-lite/dist-production/SHA256SUMS.txt

      - name: Upload signed production build
        uses: actions/upload-artifact@v4
        with:
          name: pipupath-lite-production-${{ github.sha }}
          path: android-lite/dist-production/
          if-no-files-found: error
          retention-days: 14
