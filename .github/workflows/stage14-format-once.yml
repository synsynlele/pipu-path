name: Stage 14 one-shot formatter

on:
  push:
    branches:
      - agent/stage-14-retention-intelligence-foundation
    paths:
      - ".github/workflows/stage14-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stage-14-retention-intelligence-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted Stage 14 files and remove formatter
        run: |
          rm .github/workflows/stage14-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(stage14): apply validated formatting"
          git push origin HEAD:agent/stage-14-retention-intelligence-foundation
