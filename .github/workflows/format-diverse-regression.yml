name: Format updated diverse chapter regression once
on:
  push:
    branches: [feat/diverse-chapters-repeatable-builder-shop-20261031]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/diverse-chapters-repeatable-builder-shop-20261031
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install prettier --write scripts/power-district/runtime-layout.mjs
      - name: Commit and remove this temporary formatting workflow
        run: |
          git config user.name "PipuPath CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/format-diverse-regression.yml
          git add scripts/power-district/runtime-layout.mjs
          git commit -m "style: format diverse mobile test and retire formatter"
          git push origin HEAD:refs/heads/feat/diverse-chapters-repeatable-builder-shop-20261031
